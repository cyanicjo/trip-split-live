<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src https://edyaihnztjshxsfissck.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title>관리자 조회 · 여행 n빵</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <main>
    <header><div><p class="eyebrow">여행 n빵 · 관리자</p><h1>전체 여행 조회</h1></div><a href="./">여행 화면으로</a></header>
    <p>등록된 관리자만 전체 여행을 조회할 수 있습니다. 여기서는 내용을 수정하지 않습니다.</p>
    <div class="toolbar">
      <button id="admin-login" type="button">Google로 로그인</button>
      <button id="admin-logout" type="button" hidden>로그아웃</button>
      <button id="admin-refresh" type="button" hidden>목록 새로고침</button>
    </div>
    <p id="admin-status" role="status" aria-live="polite">로그인 상태를 확인하고 있습니다.</p>
    <section id="admin-list-panel" aria-labelledby="list-heading" hidden>
      <h2 id="list-heading">여행 목록</h2><p>최근 생성 순 · 한 페이지에 최대 50개</p>
      <div id="admin-list"></div>
      <nav class="toolbar" aria-label="여행 목록 페이지">
        <button id="admin-prev" type="button">이전</button><span id="admin-page"></span><button id="admin-next" type="button">다음</button>
      </nav>
    </section>
    <section id="admin-detail" aria-label="여행 상세" hidden></section>
  </main>
  <script src="./config.js"></script>
  <script type="module" src="./admin-entry.mjs"></script>
</body>
</html>
